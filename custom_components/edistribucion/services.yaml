consultar_consumo:
  name: Consultar consumo
  description: Consulta el consumo importado/exportado de un suministro para un rango y fecha de referencia concretos (no solo el actual).
  fields:
    device_id:
      name: Suministro
      description: Dispositivo del suministro (CUPS) a consultar.
      required: true
      selector:
        device:
          integration: edistribucion
    range:
      name: Rango
      description: "1 = día, 2 = semana, 3 = mes."
      required: false
      default: "3"
      selector:
        select:
          options:
            - "1"
            - "2"
            - "3"
    fecha:
      name: Fecha de referencia
      description: Fecha (AAAA-MM-DD) respecto a la que calcular el rango. Si se omite, se usa hoy.
      required: false
      selector:
        date:

exportar_precios_pvpc:
  name: Exportar precios PVPC
  description: Vuelca a CSV los precios PVPC ya cacheados (del mes en curso), para analizarlos fuera de Home Assistant.
  fields:
    zona:
      name: Zona
      description: "Limita el volcado a una zona (PCB o CYM). Si se omite, incluye todas las que haya."
      required: false
      selector:
        select:
          options:
            - "PCB"
            - "CYM"

horas_mas_baratas_pvpc:
  name: Horas más baratas PVPC
  description: Busca la ventana de N horas consecutivas más barata a partir de ahora, con los precios PVPC ya cacheados — para automatizar cargas oportunistas (coche eléctrico, batería).
  fields:
    horas:
      name: Horas
      description: Tamaño de la ventana consecutiva a buscar (1-24).
      required: true
      selector:
        number:
          min: 1
          max: 24
          mode: box
    zona:
      name: Zona
      description: "PCB (Península/Baleares/Canarias) o CYM (Ceuta/Melilla). Por defecto, PCB."
      required: false
      selector:
        select:
          options:
            - "PCB"
            - "CYM"

resumen_mensual:
  name: Resumen mensual
  description: Genera un resumen en CSV del coste estimado del mes en curso de un suministro (por periodo, término de potencia, excedentes) — una estimación propia, no la factura real.
  fields:
    device_id:
      name: Suministro
      description: Dispositivo del suministro (CUPS) del que generar el resumen.
      required: true
      selector:
        device:
          integration: edistribucion

rellenar_historico:
  name: Rellenar histórico completo
  description: Rellena el histórico de estadísticas del Dashboard de Energía para meses ANTERIORES al actual (el relleno automático solo cubre el mes en curso) — útil recién instalada la integración o al recuperar histórico de otra solución.
  fields:
    device_id:
      name: Suministro
      description: Dispositivo del suministro (CUPS) a rellenar. Si se omite, se rellenan todos los suministros seguidos.
      required: false
      selector:
        device:
          integration: edistribucion
    meses:
      name: Meses
      description: Cuántos meses hacia atrás rellenar, incluido el mes en curso (1-36).
      required: false
      default: 12
      selector:
        number:
          min: 1
          max: 36
          mode: box
