name: "e-distribución"
version: "1.1.4"
slug: "edistribucion"
description: "API local (sin depender de ningún servidor externo) para tus datos de consumo, potencia y suministros de e-distribución (Zona Privada)."
url: "https://github.com/agustinscaz/edistribucion-ha"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:transmission-tower
panel_title: e-distribución
# /tmp en RAM: ahí escribe Chromium su perfil temporal, caché y artefactos en cada login (60-90 MB
# por login que antes acababan en el disco del host).
tmpfs: true
options:
  dni: ""
  password: ""
  base_url: "https://zonaprivada.edistribucion.com"
  keepalive_minutes: 10
schema:
  dni: str
  password: password
  base_url: str
  keepalive_minutes: "int(0,60)?"
